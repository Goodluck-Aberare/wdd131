<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us | True Light Data Analytics</title>
  <link rel="stylesheet" href="styles/styles.css" />
  <script defer src="scripts/script.js"></script>
</head>
<body>
  <header>
    <div class="logo">True Light Data Analytics</div>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
      <button id="menu-toggle" aria-label="Toggle navigation">☰</button>
    </nav>
  </header>

  <main>
    <section class="page-header">
      <h1>Contact Us</h1>
      <p>We’d love to hear from you. Fill out the form below and we’ll get back to you shortly.</p>
    </section>

    <section class="contact-form">
      <form id="contactForm" novalidate>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required />

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required />

        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit">Send Message</button>
        <p id="form-feedback" class="feedback"></p>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 True Light Data Analytics</p>
  </footer>
</body>
</html>
